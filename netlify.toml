# Batcave: the Bat City newsletter and blog post composers.
# public/index.html is the Newsletter page. public/posts.html is the Blog posts page.
# netlify/functions/api.mjs answers /api/*.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/posts"
  to = "/posts.html"
  status = 200

[[redirects]]
  from = "/posts/"
  to = "/posts.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data: blob:; frame-src 'self' data: blob: about:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
